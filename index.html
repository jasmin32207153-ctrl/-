<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5f1">
  <title>구독 정리 | Subtrack</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#top" aria-label="구독 정리 홈">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span>subtrack<span class="brand-period">.</span></span>
      </a>
      <span class="local-label"><span class="status-dot"></span> 내 기기에 저장 중</span>
    </header>

    <main id="top">
      <section class="intro" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">YOUR MONTHLY COMMITMENTS</p>
          <h1 id="page-title">구독, 한눈에 정리.</h1>
          <p class="intro-copy">매달 빠져나가는 비용과 다음 결제일을 확인하세요.</p>
        </div>
        <time id="today-label" class="today-label"></time>
      </section>

      <section class="summary-grid" aria-label="구독 지출 요약">
        <article class="summary-item summary-primary">
          <span class="summary-label">월 구독료</span>
          <strong id="monthly-total" class="summary-value">₩0</strong>
          <span class="summary-note">매월 기준 환산</span>
        </article>
        <article class="summary-item">
          <span class="summary-label">연간 예상 지출</span>
          <strong id="yearly-total" class="summary-value">₩0</strong>
          <span class="summary-note">월 구독료 × 12개월</span>
        </article>
        <article class="summary-item">
          <span class="summary-label">이번 주 결제 예정</span>
          <strong id="due-count" class="summary-value">0건</strong>
          <span id="due-note" class="summary-note">예정된 결제가 없습니다</span>
        </article>
      </section>

      <div class="content-grid">
        <section class="subscriptions-panel" aria-labelledby="subscriptions-title">
          <div class="section-heading">
            <div>
              <p class="eyebrow">YOUR SERVICES</p>
              <h2 id="subscriptions-title">구독 목록 <span id="subscription-count" class="count-badge">0</span></h2>
            </div>
            <span class="sort-note">결제일이 가까운 순</span>
          </div>
          <div id="subscription-list" class="subscription-list" aria-live="polite"></div>
        </section>

        <aside class="side-column">
          <section class="category-panel" aria-labelledby="category-title">
            <div class="section-heading compact-heading">
              <div>
                <p class="eyebrow">SPENDING MIX</p>
                <h2 id="category-title">카테고리 비중</h2>
              </div>
            </div>
            <div id="category-breakdown" class="category-breakdown"></div>
          </section>

          <section id="form-panel" class="form-panel" aria-labelledby="form-title">
            <div class="section-heading compact-heading">
              <div>
                <p class="eyebrow">SUBSCRIPTION DETAILS</p>
                <h2 id="form-title">새 구독 추가</h2>
              </div>
            </div>
            <form id="subscription-form">
              <input id="subscription-id" name="id" type="hidden">
              <label class="field">
                <span>구독 이름</span>
                <input id="name" name="name" type="text" placeholder="예: 음악 스트리밍" maxlength="50" required>
              </label>
              <div class="field-row">
                <label class="field">
                  <span>결제 금액</span>
                  <div class="amount-input"><span aria-hidden="true">₩</span><input id="amount" name="amount" type="number" min="1" step="1" placeholder="10,900" required></div>
                </label>
                <label class="field">
                  <span>결제 주기</span>
                  <select id="cycle" name="cycle">
                    <option value="monthly">매월</option>
                    <option value="yearly">매년</option>
                  </select>
                </label>
              </div>
              <label class="field">
                <span>다음 결제일</span>
                <input id="next-payment-date" name="nextPaymentDate" type="date" required>
              </label>
              <div class="field-row">
                <label class="field">
                  <span>카테고리</span>
                  <input id="category" name="category" type="text" placeholder="예: 영상" maxlength="30" required>
                </label>
                <label class="field">
                  <span>결제 수단 <span class="optional">선택</span></span>
                  <input id="payment-method" name="paymentMethod" type="text" placeholder="예: 신한카드" maxlength="30">
                </label>
              </div>
              <div class="form-actions">
                <button id="cancel-edit" class="button button-quiet" type="button" hidden>취소</button>
                <button id="submit-button" class="button button-primary" type="submit"><span aria-hidden="true">＋</span> 구독 추가</button>
              </div>
            </form>
          </section>
        </aside>
      </div>
    </main>
    <footer class="footer-note">구독 데이터는 이 브라우저의 저장 공간에만 보관됩니다.</footer>
  </div>

  <script src="js/logic.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
